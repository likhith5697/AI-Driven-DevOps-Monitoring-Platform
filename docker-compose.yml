services:
  # =======================
  # OpenSearch
  # =======================
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Str0ng@Passw0rd#2026!!
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observai-network

  # =======================
  # Payment Service
  # =======================
  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "3001:3001"
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - NODE_ENV=production
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - observai-network

  # =======================
  # Inventory Service
  # =======================
  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "3002:3002"
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - NODE_ENV=production
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - observai-network

  # =======================
  # Order Service
  # =======================
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "3000:3000"
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
      - OPENSEARCH_URL=http://opensearch:9200
      - NODE_ENV=production
    depends_on:
      payment-service:
        condition: service_started
      inventory-service:
        condition: service_started
      opensearch:
        condition: service_healthy
    networks:
      - observai-network

  # =======================
  # Prometheus
  # =======================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./order-service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - order-service
    networks:
      - observai-network

  # =======================
  # MCP SERVER
  # =======================
  mcp-server:
    build:
      context: ./python-agent
      dockerfile: Dockerfile.mcp
    container_name: observai-mcp-server
    ports:
      - "5001:5001"
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=Str0ng@Passw0rd#2026!!
      - OPENSEARCH_INDEX_PATTERN=*service-logs-*
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      opensearch:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - observai-network

  # =======================
  # HEALTH AGENT
  # =======================
  health-agent:
    build:
      context: ./python-agent
      dockerfile: Dockerfile
    container_name: observai-health-agent
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp-server:5001
      - AGENT_MODEL=gpt-4.1-nano
    depends_on:
      - mcp-server
    networks:
      - observai-network

# =======================
# Network
# =======================
networks:
  observai-network:
    driver: bridge